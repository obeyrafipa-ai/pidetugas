<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordatorio Mensual</title>
    <style>
        :root {
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border: #e5e5e5;
            --btn-google-bg: #f5f5f7;
            --btn-google-text: #111111;
            --btn-apple-bg: #000000;
            --btn-apple-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--card-bg);
            padding: 40px 32px;
            border-radius: 20px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .frase-container {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
            font-style: italic;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 32px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input[type="date"] {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: transparent;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            transition: border-color 0.2s ease;
        }

        input[type="date"]:focus {
            border-color: #999999;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-google {
            background-color: var(--btn-google-bg);
            color: var(--btn-google-text);
        }

        .btn-apple {
            background-color: var(--btn-apple-bg);
            color: var(--btn-apple-text);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RECUERDA PEDIR TU GAS</h1>
    <p class="subtitle">Elige el día que prefieras para pedir tu GAS cada mes.</p>
    
    <div class="frase-container">
        "Pide Tu GAS URIBE HOY."
    </div>

    <div class="input-group">
        <label for="fecha">Día de inicio</label>
        <input type="date" id="fecha" required>
    </div>

    <div class="actions">
        <!-- Google Calendar -->
        <button class="btn btn-google" onclick="agregarGoogle()">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Google Calendar
        </button>

        <!-- Apple Calendar -->
        <button class="btn btn-apple" onclick="agregarApple()">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.71,19.5C17.88,20.74 17,21.95 15.66,21.97C14.32,22 13.89,21.18 12.37,21.18C10.84,21.18 10.37,21.95 9.1,22C7.79,22.05 6.8,20.68 5.96,19.48C4.25,17 2.94,12.45 4.7,9.39C5.57,7.87 7.14,6.9 8.82,6.88C10.1,6.86 11.32,7.75 12.11,7.75C12.89,7.75 14.37,6.68 15.92,6.84C16.57,6.87 18.39,7.1 19.56,8.82C19.47,8.88 17.39,10.1 17.41,12.63C17.44,15.65 20.06,16.66 20.1,16.67C20.08,16.74 19.67,18.11 18.71,19.5M15.97,4.17C16.63,3.37 17.07,2.28 16.95,1C16,1.04 14.9,1.6 14.24,2.38C13.68,3.04 13.19,4.14 13.34,5.39C14.39,5.47 15.4,4.88 15.97,4.17Z"/>
            </svg>
            Apple Calendar
        </button>
    </div>
</div>

<script>
    // Establecer fecha de hoy por defecto
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fecha').value = hoy;

    // Configuración del contenido
    const TITULO_EVENTO = "Mi Recordatorio Mensual";
    const FRASE_EVENTO = "Este es tu momento del mes para revisar tus metas y respirar profundo.";

    function obtenerFechasFormateadas(fechaInput) {
        const dateObj = new Date(fechaInput + 'T09:00:00');
        const yyyy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        
        return {
            inicio: `${yyyy}${mm}${dd}T090000`,
            fin: `${yyyy}${mm}${dd}T100000`
        };
    }

    function agregarGoogle() {
        const fechaVal = document.getElementById('fecha').value;
        if (!fechaVal) return;
        const fechas = obtenerFechasFormateadas(fechaVal);
        
        const googleUrl = `https://google.com` +
            `&text=${encodeURIComponent(TITULO_EVENTO)}` +
            `&details=${encodeURIComponent(FRASE_EVENTO)}` +
            `&dates=${fechas.inicio}/${fechas.fin}` +
            `&recur=RRULE:FREQ=MONTHLY`;
            
        window.open(googleUrl, '_blank');
    }

    function agregarApple() {
        const fechaVal = document.getElementById('fecha').value;
        if (!fechaVal) return;
        const fechas = obtenerFechasFormateadas(fechaVal);

        const icsTXT = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//MiRecordatorio//NONSGML v1.0//ES",
            "BEGIN:VEVENT",
            `DTSTART:${fechas.inicio}`,
            `DTEND:${fechas.fin}`,
            `RRULE:FREQ=MONTHLY`, 
            `SUMMARY:${TITULO_EVENTO}`,
            `DESCRIPTION:${FRASE_EVENTO}`,
            "END:VEVENT",
            "END:VCALENDAR"
        ].join("\n");

        const blob = new Blob([icsTXT], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = "recordatorio-mensual.ics";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>

}
